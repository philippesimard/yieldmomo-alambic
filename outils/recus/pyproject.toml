[project]
name = "generateur-recus-quebec"
version = "0.2.0"
description = "Générateur de reçus et factures synthétiques québécois annotés pour le fine-tuning de modèles de reconnaissance (Donut / VLM)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["generateur", "generateur.produits"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
